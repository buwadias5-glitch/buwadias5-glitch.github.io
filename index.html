<style>
:root{--bg:#0a1020;--bg2:#101a33;--card:#16223f;--line:#2b3d6b;--accent:#6ea8ff;--white:#ffffff}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;font-family:"Source Sans 3",system-ui,sans-serif;font-size:1.0625rem;line-height:1.65;color:var(--white);background:var(--bg)}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.15;margin:0}
a{color:var(--accent)}
a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:960px;margin:0 auto;padding:0 1.25rem}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:1.25rem;align-items:center;overflow-x:auto;white-space:nowrap;padding-top:.8rem;padding-bottom:.8rem}
nav strong{font-family:"Bricolage Grotesque",sans-serif;color:var(--white);margin-right:auto}
nav a{color:var(--white);text-decoration:none;font-size:.95rem}
nav a:hover{color:var(--accent);text-decoration:underline}
.hero{color:var(--white);padding:3.5rem 0 4rem;background:radial-gradient(circle at 80% 20%,#1c3270 0%,var(--bg) 60%)}
.hero .wrap{display:grid;grid-template-columns:1.3fr 1fr;gap:2.5rem;align-items:center}
.hero h1{font-size:clamp(2.2rem,6vw,3.6rem);font-weight:800}
.hero p{color:var(--white);max-width:34rem}
.btns{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:1.5rem}
.btn{display:inline-block;padding:.65rem 1.2rem;border-radius:6px;text-decoration:none;font-weight:600;border:2px solid var(--white);color:var(--white)}
.btn.primary,.btn.dl{background:var(--white);border-color:var(--white);color:var(--bg)}
.btn:hover{text-decoration:underline}
.dish{position:relative;width:min(100%,320px);aspect-ratio:1;margin:0 auto;border-radius:50%;border:6px solid var(--white);background:#1c3270;overflow:hidden;box-shadow:0 0 0 10px rgba(110,168,255,.25)}
.dish svg{position:absolute;inset:0;width:100%;height:100%}
.dish img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
section{padding:3.2rem 0;background:var(--bg);color:var(--white)}
section.alt{background:var(--bg2);border-block:1px solid var(--line)}
section h2{font-size:1.9rem;margin-bottom:1.4rem;padding-left:.9rem;border-left:6px solid var(--accent)}
.card{background:var(--card);color:var(--white);border:1px solid var(--line);border-radius:10px;padding:1.2rem 1.4rem}
.card+.card{margin-top:1rem}
.card h3{font-size:1.15rem}
.meta{opacity:.8;font-size:.95rem;margin:.15rem 0 .5rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem}
.grid .card+.card{margin-top:0}
.tags{display:flex;flex-wrap:wrap;gap:.5rem;padding:0;margin:0;list-style:none}
.tags li{background:transparent;border:1px solid var(--accent);color:var(--white);border-radius:999px;padding:.2rem .8rem;font-size:.95rem}
ul.plain{margin:.4rem 0 0;padding-left:1.2rem}
.contact dl{display:grid;grid-template-columns:max-content 1fr;gap:.5rem 1.25rem;margin:0}
.contact dt{font-weight:600}.contact dd{margin:0}
footer{background:var(--bg);border-top:1px solid var(--line);color:var(--white);text-align:center;padding:1.5rem 1rem;font-size:.95rem}
@media(max-width:720px){.hero .wrap{grid-template-columns:1fr}.dish{order:-1;width:220px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>

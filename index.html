<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buwanaji Dias Nagahawatte | Biotechnology Student E-Portfolio</title>
<meta name="description" content="E-portfolio of Buwanaji Dias Nagahawatte, BSc (Hons) in Biotechnology undergraduate at SLIIT.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b1120;--blue:#1d4fa8;--muted:#4a5a73;--line:#d5deec;--soft:#f1f5fb;--mint:#65e4c2}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;font-family:"Source Sans 3",system-ui,sans-serif;font-size:1.0625rem;line-height:1.65;color:var(--navy);background:#fff}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.15;margin:0}
a{color:var(--blue)}
a:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.wrap{max-width:960px;margin:0 auto;padding:0 1.25rem;position:relative;z-index:1}
nav{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:1.25rem;align-items:center;overflow-x:auto;white-space:nowrap;padding-top:.8rem;padding-bottom:.8rem}
nav strong{font-family:"Bricolage Grotesque",sans-serif;color:var(--navy);margin-right:auto}
nav a{color:var(--navy);text-decoration:none;font-size:.95rem}
nav a:hover{color:var(--blue);text-decoration:underline}
.hero{position:relative;overflow:hidden;padding:3.5rem 0 4rem;background:radial-gradient(circle at 78% 30%,#dbe9ff 0%,#fff 62%)}
.helix{position:absolute;right:4%;top:0;height:100%;width:auto;opacity:.14;stroke:var(--blue);pointer-events:none}
.hero .wrap{display:grid;grid-template-columns:1.3fr 1fr;gap:2.5rem;align-items:center}
.hero h1{font-size:clamp(2.2rem,6vw,3.6rem);font-weight:800;text-transform:uppercase;letter-spacing:.02em}
.hero p{color:var(--muted);max-width:34rem;font-size:1.15rem}
.btns{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:1.5rem}
.btn{display:inline-block;padding:.65rem 1.2rem;border-radius:7px;text-decoration:none;font-weight:600;border:2px solid var(--navy);color:var(--navy);transition:.25s}
.btn.primary{background:var(--navy);color:#fff}
.btn:hover{transform:translateY(-3px);opacity:.9}
.dish{position:relative;width:min(100%,320px);aspect-ratio:1;margin:0 auto;border-radius:50%;border:6px solid var(--mint);background:#dbe9ff;overflow:hidden;box-shadow:0 0 0 10px rgba(29,79,168,.12)}
.dish img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 15%}
section{padding:3.2rem 0;background:#fff}
section.alt{background:var(--soft)}
section h2{font-size:2rem;margin-bottom:1.4rem;padding-left:.9rem;border-left:5px solid var(--blue)}
.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:1.2rem 1.4rem;box-shadow:0 2px 10px rgba(11,17,32,.05);transition:.25s}
.card:hover{border-color:var(--blue);transform:translateY(-4px)}
.card+.card{margin-top:1rem}
.card h3{font-size:1.15rem;color:var(--blue)}
.card p,.card li,.meta{color:var(--muted)}
.card strong{color:var(--navy)}
.meta{font-size:.95rem;margin:.15rem 0 .5rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem}
.grid .card+.card{margin-top:0}
.ico{width:46px;height:46px;margin-bottom:.6rem;fill:none;stroke:var(--blue);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tags{display:flex;flex-wrap:wrap;gap:.5rem;padding:0;margin:0;list-style:none}
.tags li{background:#eaf1ff;border:1px solid #c3d3f0;color:var(--blue);border-radius:999px;padding:.2rem .8rem;font-size:.95rem}
ul.plain{margin:.4rem 0 0;padding-left:1.2rem}
.contact dl{display:grid;grid-template-columns:max-content 1fr;gap:.5rem 1.25rem;margin:0}
.contact dt{font-weight:600}.contact dd{margin:0}
.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.15em;flex:none}
section h2 .i{width:1.15em;height:1.15em;margin-right:.55rem;vertical-align:-.17em;color:var(--blue)}
.card h3 .i{width:1.1em;height:1.1em;margin-right:.45rem}
.tags .i{margin-right:.35rem}
.contact dt .i{margin-right:.4rem;color:var(--blue)}
ul.aw{list-style:none;padding-left:0}
.aw li{position:relative;padding-left:1.9rem;margin:.6rem 0}
.aw .i{position:absolute;left:0;top:.3em;color:var(--blue);width:1.1em;height:1.1em}
.sub{font-size:1.35rem;margin:0 0 1rem}
.sub.second{margin-top:2.4rem}
.grid>.card>.i{display:block;width:2.4rem;height:2.4rem;stroke-width:1.5;margin-bottom:.6rem;color:var(--blue)}
footer{background:var(--soft);border-top:1px solid var(--line);color:var(--muted);text-align:center;padding:1.5rem 1rem;font-size:.95rem}
@media(max-width:720px){.hero .wrap{grid-template-columns:1fr}.dish{order:-1;width:220px}.helix{opacity:.1}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.card,.btn{transition:none}.card:hover,.btn:hover{transform:none}}
</style>
</head>
